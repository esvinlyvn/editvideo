<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Project mẫu</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
{{FONTS}}
      /* 2 font: Montserrat (tiêu đề) · Be Vietnam Pro (phụ đề). 1 màu chữ chính + 1 màu nhấn.
         Vùng an toàn ≥10%: x 108–972, y 192–1728. Phụ đề ở top 1500, chừa lề phải 150px. */
      :root { --disp: "Montserrat", sans-serif; --body: "Be Vietnam Pro", sans-serif; --bg: #14161c; --fg: #f4f4f0; --accent: #4cc3ff; }
      body { margin: 0; background: var(--bg); font-family: var(--body); color: var(--fg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
      .scene, .in { position: absolute; inset: 0; }
      .h { position: absolute; left: 108px; right: 108px; top: 300px; text-align: center; font-family: var(--disp); font-weight: 800; font-size: 84px; line-height: 1.1; }
      .h .blk { display: block; white-space: nowrap; }
      .a { color: var(--accent); }
      .box { position: absolute; left: 340px; top: 700px; width: 400px; height: 400px; border-radius: 48px; background: var(--accent); opacity: 0; }
      .row { position: absolute; left: 108px; right: 108px; top: 760px; display: flex; gap: 30px; }
      .chip { flex: 1; height: 220px; border-radius: 28px; background: var(--fg); color: var(--bg); display: flex; align-items: center; justify-content: center; font-family: var(--disp); font-weight: 800; font-size: 72px; opacity: 0; }
      .tap { position: absolute; left: 540px; top: 870px; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; border: 8px solid var(--accent); box-sizing: border-box; opacity: 0; }
      .cap { position: absolute; left: 108px; right: 150px; top: 1500px; display: flex; justify-content: center; }
      .cap-in { margin: 0; max-width: 800px; text-align: center; font-weight: 600; font-size: 44px; line-height: 1.38; color: #fff;
        padding: 10px 24px 12px; border-radius: 14px; background: rgba(0, 0, 0, 0.78); text-shadow: 0 2px 6px rgba(0,0,0,.35); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="example" data-start="0" data-width="1080" data-height="1920" data-duration="{{DURATION}}">

      <!-- Cảnh 1 -->
      <div class="clip scene" id="s1" data-start="0" data-duration="2.5" data-track-index="1"><div class="in" id="s1-in">
        <div class="h" id="h1"><span class="blk">Project mẫu</span><span class="blk a">của bộ công cụ</span></div>
        <div class="box" id="box"></div>
      </div></div>

      <!-- Cảnh 2 -->
      <div class="clip scene" id="s2" data-start="2.45" data-duration="2.6" data-track-index="1"><div class="in" id="s2-in">
        <div class="h"><span class="blk">Câu nói</span><span class="blk a">thành phụ đề</span></div>
        <div class="row"><div class="chip" id="c1">1</div><div class="chip" id="c2">2</div><div class="chip" id="c3">3</div></div>
      </div></div>

      <!-- Cảnh 3 -->
      <div class="clip scene" id="s3" data-start="5.0" data-duration="{{END_DUR}}" data-track-index="1"><div class="in" id="s3-in">
        <div class="h"><span class="blk">Sửa template</span><span class="blk a">rồi build</span></div>
        <div class="box" id="box2"></div>
        <div class="tap" id="tap"></div>
      </div></div>

      {{CAPTIONS}}

      {{SFX}}
      <audio id="voice" src="assets/voice.wav" data-start="0" data-duration="{{VOICE_DUR}}" data-track-index="9" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";
      const up = (sel, at, d = 0.5, y = 36) => tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: E }, at);
      const pop = (sel, at, s = 0.7) => tl.fromTo(sel, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(2)" }, at);
      const tap = (sel, at) => tl.fromTo(sel, { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.5, duration: 0.5, ease: "power2.out", immediateRender: false }, at);

      // Mỗi cảnh: lớp .in mờ vào ở đầu cảnh, mờ ra ngay trước khi clip kết thúc
      [["#s1-in", 0, 2.5], ["#s2-in", 2.45, 5.05], ["#s3-in", 5.0, 99]].forEach(([s, a, b], i) => {
        if (i) tl.fromTo(s, { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.36, ease: E }, a + 0.02);
        if (b < 99) tl.to(s, { opacity: 0, duration: 0.15 }, b - 0.18);
      });

      up("#h1", 0.1, 0.45, 24);
      pop("#box", 0.6, 0.5);
      tl.to("#box", { rotation: 90, duration: 0.8, ease: "power2.inOut" }, 1.2);
      ["#c1", "#c2", "#c3"].forEach((c, k) => pop(c, 2.8 + k * 0.6, 0.5));
      pop("#box2", 5.4, 0.5);
      tap("#tap", 6.4);
      tl.fromTo("#box2", { scale: 1 }, { scale: 0.9, duration: 0.1, yoyo: true, repeat: 1, immediateRender: false }, 6.4);

      // Phụ đề do build.mjs sinh: hiện đúng mốc data-start
      document.querySelectorAll(".cap").forEach((el) =>
        tl.fromTo(el.firstElementChild, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, parseFloat(el.dataset.start)));

      window.__timelines["example"] = tl;
    </script>
  </body>
</html>
