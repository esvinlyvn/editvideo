<svg id="plan" width="864" height="864" viewBox="0 0 1000 1000" fill="none" font-family="Space Grotesk, sans-serif">
  <defs>
    <pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="rgba(31,45,61,.07)" stroke-width="2"/></pattern>
  </defs>
  <rect x="40" y="40" width="920" height="920" fill="url(#tile)"/>
  <!-- tường -->
  <g stroke="#1f2d3d" stroke-width="14" stroke-linecap="square">
    <rect x="40" y="40" width="920" height="920"/>
    <path d="M520 40V480"/>
    <path d="M40 480H300M420 480H520"/>
    <path d="M40 620H180M300 620H420V960"/>
  </g>
  <!-- cửa phòng ngủ (thủ phạm) -->
  <g id="door">
    <rect id="door-glow" x="292" y="440" width="136" height="80" rx="14" fill="#0fa3a3" opacity="0"/>
    <path d="M300 480L300 362" stroke="#1f2d3d" stroke-width="8" stroke-linecap="round" id="door-leaf"/>
    <path d="M300 362A118 118 0 0 1 418 480" stroke="#1f2d3d" stroke-width="3" stroke-dasharray="8 8"/>
  </g>
  <!-- cửa bếp -->
  <path d="M180 620L180 738" stroke="#1f2d3d" stroke-width="8" stroke-linecap="round"/>
  <path d="M180 738A118 118 0 0 0 298 620" stroke="#1f2d3d" stroke-width="3" stroke-dasharray="8 8"/>
  <!-- nhãn phòng -->
  <g font-size="26" font-weight="700" fill="rgba(31,45,61,.45)" letter-spacing="3">
    <text x="70" y="450">PHÒNG NGỦ</text><text x="560" y="90">PHÒNG KHÁCH</text><text x="70" y="935">BẾP</text>
  </g>
  <!-- giường -->
  <rect x="80" y="90" width="230" height="290" rx="16" stroke="#1f2d3d" stroke-width="5" fill="#fff"/>
  <rect x="100" y="106" width="86" height="56" rx="10" stroke="#1f2d3d" stroke-width="4"/><rect x="204" y="106" width="86" height="56" rx="10" stroke="#1f2d3d" stroke-width="4"/>
  <path d="M80 200H310" stroke="#1f2d3d" stroke-width="4"/>
  <!-- sofa + bàn -->
  <rect x="600" y="760" width="300" height="110" rx="20" stroke="#1f2d3d" stroke-width="5" fill="#fff"/>
  <rect x="660" y="560" width="200" height="120" rx="14" stroke="#1f2d3d" stroke-width="5" fill="#fff"/>
  <!-- cục sạc trên bàn -->
  <g id="charger" transform="translate(760 620)">
    <rect x="-22" y="-26" width="44" height="40" rx="8" fill="#1f2d3d"/><path d="M-10 -26v-16M10 -26v-16" stroke="#1f2d3d" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 14c0 30 30 20 40 40" stroke="#1f2d3d" stroke-width="5" fill="none"/>
  </g>
  <!-- bếp: tủ lạnh + kệ -->
  <rect x="70" y="660" width="90" height="150" rx="10" stroke="#1f2d3d" stroke-width="5" fill="#fff"/><path d="M70 715H160" stroke="#1f2d3d" stroke-width="4"/>
  <rect x="320" y="650" width="80" height="290" rx="8" stroke="#1f2d3d" stroke-width="5" fill="#fff"/>
  <!-- đường đi thẳng (mẹo 2) -->
  <path id="route" d="M200 230L360 300L360 560L760 620" stroke="#0fa3a3" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 22" opacity="0"/>
  <!-- nhân vật (nhìn từ trên xuống) + bong bóng suy nghĩ -->
  <g id="pawn" transform="translate(200 250)">
    <circle r="34" fill="#0fa3a3" stroke="#1f2d3d" stroke-width="5"/>
    <circle cx="-10" cy="-6" r="4" fill="#1f2d3d"/><circle cx="10" cy="-6" r="4" fill="#1f2d3d"/>
    <g id="mi" opacity="0" transform="translate(48 6)">
      <rect x="-24" y="-30" width="48" height="60" rx="8" fill="#f2c94c" stroke="#1f2d3d" stroke-width="4"/>
      <path d="M-14 -8c6-6 10 6 16 0s10 6 14 0M-14 6c6-6 10 6 16 0s10 6 14 0" stroke="#1f2d3d" stroke-width="3"/>
    </g>
    <g id="bub" opacity="0" transform="translate(70 -120)">
      <circle cx="-40" cy="80" r="8" fill="#fff" stroke="#1f2d3d" stroke-width="4"/><circle cx="-20" cy="58" r="12" fill="#fff" stroke="#1f2d3d" stroke-width="4"/>
      <circle r="62" fill="#fff" stroke="#1f2d3d" stroke-width="5"/>
      <g id="ic-charger"><rect x="-20" y="-16" width="40" height="36" rx="7" fill="#1f2d3d"/><path d="M-9 -16v-14M9 -16v-14" stroke="#1f2d3d" stroke-width="6" stroke-linecap="round"/></g>
      <text id="ic-q" x="0" y="26" text-anchor="middle" font-size="84" font-weight="700" fill="#0fa3a3" opacity="0">?</text>
      <g id="ic-glass" opacity="0"><path d="M-20 -30h40l-6 58h-28z" stroke="#1f2d3d" stroke-width="5" fill="rgba(15,163,163,.25)"/></g>
    </g>
  </g>
  <!-- nhãn cửa -->
  <g id="tag" opacity="0" transform="translate(360 560)">
    <rect x="-110" y="-34" width="220" height="68" rx="16" fill="#1f2d3d"/>
    <text id="tag1" x="0" y="13" text-anchor="middle" font-size="36" font-weight="700" fill="#fff" letter-spacing="2">THỦ PHẠM</text>
    <text id="tag2" x="0" y="13" text-anchor="middle" font-size="36" font-weight="700" fill="#7ee0d6" letter-spacing="2" opacity="0">VÔ TỘI</text>
  </g>
</svg>
